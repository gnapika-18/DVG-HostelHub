{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h1>Mark Attendance</h1>
    <p>Record today's attendance for hostel residents.</p>
</div>

<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            ✅ Mark Attendance
        </button>

        <a href="{% url 'attendance_list' %}" class="btn btn-secondary">
            ← Attendance History
        </a>

    </form>

</div>

{% endblock %}
